description: CubeWerx provides a geospatial platform and related services that enable organizations to manage, secure, and publish geospatial
  data as web services. It offers cloud‑hosted and on‑premise solutions, managed services, and self‑serve tools for commercial data providers,
  government agencies, and defense and intelligence customers. The company also supplies analytics, access control, and consulting to support
  spatial data infrastructures.

